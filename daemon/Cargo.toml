[package]
name = "puny-daemon"
version = "0.1.0"
edition = "2021"

[dependencies]
# Core async runtime
tokio = { version = "1.48", features = ["full"] }

# Networking
bytes = "1.11"

# System interaction
nix = { version = "0.29", features = ["process", "signal"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# Command line
clap = { version = "4.5", features = ["derive"] }

# Video encoding (we'll add this next phase)
# ffmpeg-next = "7.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
